[package]
name = "napi-xqdb"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node-API bindings for xqdb"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { workspace = true }
indexmap = { workspace = true }
xqdb = { path = "../../crates/xqdb" }
mimalloc = { version = "0.1", default-features = false }
napi = { version = "3.12.2", default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = "3.6.3"
polars = { workspace = true, features = ["ipc", "ipc_streaming"] }
rustls-pki-types = "1"
uuid = { workspace = true }

[build-dependencies]
napi-build = "2.4.1"
