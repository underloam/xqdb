# https://taskfile.dev

version: "3"

vars:
  VERSION:
    sh: grep "version" Cargo.toml | head -1 | cut -d'"' -f 2

tasks:
  default:
    cmds:
      - cargo update
    silent: true

  venv:
    cmds:
      - uv venv --python 3.12
      - uv pip install --group dev --group benchmark

  test:
    cmds:
      - cargo test

  lint-python:
    cmds:
      - uv run --no-project --python .venv ruff check .
      - uv run --no-project --python .venv ruff format --check .

  format-python:
    cmds:
      - uv run --no-project --python .venv ruff check --fix .
      - uv run --no-project --python .venv ruff format .

  lint-node:
    dir: js-xqdb
    cmds:
      - npm run check

  format-node:
    dir: js-xqdb
    cmds:
      - npm run lint:fix
      - npm run format

  lint:
    deps: [lint-python, lint-node]

  build-python:
    cmds:
      - env -u KX_BEARER_TOKEN -u KDB_LICENSE_B64 SETUPTOOLS_RUST_CARGO_PROFILE=release uv pip install --reinstall -e .

  build-python-release:
    cmds:
      - env -u KX_BEARER_TOKEN -u KDB_LICENSE_B64 SETUPTOOLS_RUST_CARGO_PROFILE=release uv pip install --reinstall -e .

  install-python:
    deps:
      - release-python
    cmds:
      - uv pip install dist/*

  test-python:
    deps:
      - build-python
    cmds:
      - env -u KX_BEARER_TOKEN -u KDB_LICENSE_B64 pytest -vv py-xqdb/test

  kdb-build:
    preconditions:
      - sh: test -n "$KX_BEARER_TOKEN"
        msg: KX_BEARER_TOKEN must be set
      - sh: test -n "$KDB_LICENSE_B64"
        msg: KDB_LICENSE_B64 must be set
    cmds:
      - >-
        podman build
        --format docker
        --secret id=kx-token,env=KX_BEARER_TOKEN
        --secret id=kx-license,env=KDB_LICENSE_B64
        --tag xqdb-kdb-test:local
        --file testing/kdb/Containerfile
        testing/kdb

  kdb-start:
    preconditions:
      - sh: test -n "$KDB_LICENSE_B64"
        msg: KDB_LICENSE_B64 must be set
    cmds:
      - cmd: |
          set -e
          cleanup() {
            podman rm --force --ignore xqdb-kdb-test >/dev/null 2>&1 || \
              echo "Failed to remove xqdb-kdb-test during cleanup" >&2
            podman secret rm --ignore xqdb-kdb-license >/dev/null 2>&1 || \
              echo "Failed to remove xqdb-kdb-license during cleanup" >&2
          }
          trap cleanup EXIT
          podman image exists xqdb-kdb-test:local || task kdb-build
          cleanup
          podman secret create --replace --env=true xqdb-kdb-license KDB_LICENSE_B64
          podman run --detach \
            --name xqdb-kdb-test \
            --publish 127.0.0.1:1801:1801/tcp \
            --cpus 4 \
            --memory 4g \
            --tmpfs /run/kdb-license:rw,nosuid,nodev,noexec,size=1m \
            --env XQDB_Q_ROWS=${XQDB_Q_ROWS:-10000} \
            --secret xqdb-kdb-license,target=kdb-license-b64,type=mount \
            xqdb-kdb-test:local
          for attempt in $(seq 1 30); do
            if podman healthcheck run xqdb-kdb-test >/dev/null 2>&1; then
              trap - EXIT
              exit 0
            fi
            sleep 1
          done
          podman logs xqdb-kdb-test
          exit 1

  kdb-stop:
    cmds:
      - cmd: |
          status=0
          podman rm --force --ignore xqdb-kdb-test || status=$?
          podman secret rm --ignore xqdb-kdb-license || status=$?
          exit "$status"

  # Install/build before q starts so dependency tooling cannot access the runtime
  # license. Unsetting secret variables is defense in depth, not a sandbox:
  # same-user live test code can invoke Podman and arbitrary q expressions can
  # read any license file the q process itself can read.
  test-python-podman:
    cmds:
      - defer:
          task: kdb-stop
      - env -u KX_BEARER_TOKEN -u KDB_LICENSE_B64 task build-python
      - task: kdb-start
      - >-
        env -u KX_BEARER_TOKEN -u KDB_LICENSE_B64
        XQDB_TEST_Q_EXTERNAL=1
        XQDB_TEST_Q_HOST=127.0.0.1
        XQDB_TEST_Q_PORT=1801
        XQDB_Q_ROWS=${XQDB_Q_ROWS:-10000}
        pytest -vv py-xqdb/test

  benchmark-python-podman:
    cmds:
      - defer:
          task: kdb-stop
      - env -u KX_BEARER_TOKEN -u KDB_LICENSE_B64 task build-python-release
      - env -u KX_BEARER_TOKEN -u KDB_LICENSE_B64 uv pip install --group benchmark
      - XQDB_Q_ROWS=${XQDB_BENCH_ROWS:-100000} task kdb-start
      - >-
        env -u KX_BEARER_TOKEN -u KDB_LICENSE_B64
        XQDB_TEST_Q_HOST=127.0.0.1
        XQDB_TEST_Q_PORT=1801
        python benchmarks/python/bench.py
        --warmups ${XQDB_BENCH_WARMUPS:-3}
        --iterations ${XQDB_BENCH_ITERATIONS:-50}

  build-node-release:
    dir: js-xqdb
    cmds:
      - env -u KX_BEARER_TOKEN -u KDB_LICENSE_B64 npm run build:release

  test-node-podman:
    cmds:
      - defer:
          task: kdb-stop
      - task: build-node-release
      - XQDB_Q_ROWS=${XQDB_Q_ROWS:-10000} task kdb-start
      - >-
        cd js-xqdb &&
        env -u KX_BEARER_TOKEN -u KDB_LICENSE_B64
        XQDB_TEST_Q_EXTERNAL=1
        XQDB_TEST_Q_HOST=127.0.0.1
        XQDB_TEST_Q_PORT=1801
        XQDB_Q_ROWS=${XQDB_Q_ROWS:-10000}
        npm run test:live

  benchmark-node-podman:
    cmds:
      - defer:
          task: kdb-stop
      - task: build-node-release
      - cd benchmarks/node && env -u KX_BEARER_TOKEN -u KDB_LICENSE_B64 npm install --no-audit --no-fund
      - XQDB_Q_ROWS=${XQDB_BENCH_ROWS:-100000} task kdb-start
      - >-
        cd benchmarks/node &&
        env -u KX_BEARER_TOKEN -u KDB_LICENSE_B64
        XQDB_TEST_Q_HOST=127.0.0.1
        XQDB_TEST_Q_PORT=1801
        node --expose-gc bench.mjs
        --warmups ${XQDB_BENCH_WARMUPS:-3}
        --iterations ${XQDB_BENCH_ITERATIONS:-50}
        --memory-results ${XQDB_BENCH_MEMORY_RESULTS:-5}

  # The release remote, not `origin`: `origin` is jshinonome/kola, the upstream
  # this project forked from. Pushing a tag there aims an immutable ref at a
  # third party and never triggers the npm release, which runs on underloam/xqdb.
  tag:
    vars:
      REMOTE: '{{.REMOTE | default "xqdb"}}'
    preconditions:
      - sh: git remote get-url {{.REMOTE}}
        msg: "git remote {{.REMOTE}} is not configured; set REMOTE=<name> to override"
      - sh: '[ "$(git remote get-url {{.REMOTE}})" != "$(git remote get-url origin 2>/dev/null)" ] || [ "{{.REMOTE}}" = "origin" ]'
        msg: "refusing to tag: {{.REMOTE}} resolves to the same URL as origin"
    cmds:
      - git tag -a v{{.VERSION}} -m "XQDB {{.VERSION}}" && git push {{.REMOTE}} tag v{{.VERSION}}

  release-python:
    cmds:
      - rm -rf dist build *.egg-info
      - SETUPTOOLS_RUST_CARGO_PROFILE=release uv build --wheel --out-dir dist
