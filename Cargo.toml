[workspace]
resolver = "2"
members = ["crates/*", "py-xqdb", "bindings/napi-xqdb"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.8"
authors = ["XQDB contributors"]
edition = "2021"
repository = "https://github.com/underloam/xqdb"
license = "BSD-3-Clause"
description = "a backend-agnostic Python dataframe interface to q"

[profile.dev]
opt-level = 1

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

[profile.node-release]
inherits = "release"
opt-level = 3
panic = "unwind"

# Shared by the core crate and both bindings. Centralized so an advisory or
# currency bump is a single edit instead of three manifests drifting apart.
[workspace.dependencies]
chrono = "0.4.45"
indexmap = "2.14.0"
thiserror = "2.0.18"
uuid = "1.23.3"

[workspace.dependencies.polars-buffer]
default-features = false
version = "0.55.2"

[workspace.dependencies.polars-arrow]
default-features = false
version = "0.55.2"

[workspace.dependencies.polars]
version = "0.55.2"
