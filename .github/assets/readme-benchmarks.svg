<svg width="1200" height="326" viewBox="0 0 1200 326" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xqdb IPC read benchmarks</title>
  <desc id="desc">100,000-row KDB-X 5.0 fixture read latency and throughput in Node.js 26.3 and CPython 3.12.</desc>
