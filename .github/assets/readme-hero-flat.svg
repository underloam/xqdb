<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xqdb banner</title>
  <desc id="desc">xqdb: kdb+/q IPC for Python and Node.js. Rust core, lossless typed q values, Narwhals and Arrow for any DataFrame backend, quickstart.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29244f"/>
      <stop offset="0.58" stop-color="#221f42"/>
      <stop offset="1" stop-color="#1c1b22"/>
    </linearGradient>
    <linearGradient id="mark" x1="78" y1="50" x2="214" y2="186" gradientUnits="userSpaceOnUse">
      <stop stop-color="#363068"/>
      <stop offset="1" stop-color="#221e45"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="260" rx="30"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="260" rx="30" fill="url(#card)"/>
  <g clip-path="url(#frame)">
    <text x="0" y="255" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="260" font-weight="800" fill="#ffffff" opacity="0.032">xqdbxqdbxqdbxqdb</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="29.5" stroke="#ffffff" stroke-opacity="0.10"/>

  <g transform="translate(78 62)">
    <rect width="136" height="136" rx="30" fill="url(#mark)"/>
    <text x="68" y="81" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="35" font-weight="800" fill="#ffffff">xqdb</text>
  </g>

  <g transform="translate(250 75)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="0" y="60" font-size="72" font-weight="850" letter-spacing="-3" fill="#ffffff">xqdb</text>
    <text x="3" y="98" font-size="21" font-weight="500" fill="#dcd9f0" opacity="0.84">kdb+/q IPC for Python and Node.js</text>
  </g>

  <g transform="translate(684 69)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(0 0)">
      <g fill="none" opacity="0.9"><rect x="6" y="10" width="34" height="34" rx="5" stroke="#ebe9f6" stroke-width="3"/><path d="M15 2v8M31 2v8M15 44v8M31 44v8M-2 19h8M-2 35h8M40 19h8M40 35h8" stroke="#ebe9f6" stroke-width="3" stroke-linecap="round"/><rect x="16" y="20" width="14" height="14" rx="2" stroke="#ebe9f6" stroke-width="2.5"/></g>
      <text x="62" y="17" font-size="16" fill="#bcb8d4">Rust core</text>
      <text x="62" y="46" font-size="24" font-weight="800" fill="#ffffff">Python + Node</text>
    </g>
    <g transform="translate(258 0)">
      <g fill="none" opacity="0.9"><path d="M23 3l22 11-22 11L1 14 23 3z" stroke="#ebe9f6" stroke-width="3" stroke-linejoin="round"/><path d="M1 26l22 11 22-11M1 38l22 11 22-11" stroke="#ebe9f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="62" y="17" font-size="16" fill="#bcb8d4">Typed q values</text>
      <text x="62" y="46" font-size="24" font-weight="800" fill="#ffffff">Lossless</text>
    </g>
    <g transform="translate(0 88)">
