      <text x="62" y="17" font-size="16" fill="#bcb8d4">Narwhals + Arrow</text>
      <text x="62" y="46" font-size="24" font-weight="800" fill="#ffffff">Any DataFrame</text>
    </g>
    <g transform="translate(258 88)">
      <g fill="none" opacity="0.9"><path d="M10 3l24 24-24 24" stroke="#ebe9f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="62" y="17" font-size="16" fill="#bcb8d4">Get started</text>
      <text x="62" y="46" font-size="24" font-weight="800" fill="#ffffff">Quickstart</text>
