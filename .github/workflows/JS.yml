name: JavaScript CI

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/JS.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/xqdb/**"
      - "bindings/napi-xqdb/**"
      - "js-xqdb/**"
      - "benchmarks/node/**"
      - "Taskfile.yml"
      - "testing/kdb/**"
  pull_request:
    paths:
      - ".github/workflows/JS.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/xqdb/**"
      - "bindings/napi-xqdb/**"
      - "js-xqdb/**"
      - "benchmarks/node/**"
      - "Taskfile.yml"
      - "testing/kdb/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-benchmark-syntax:
    name: Node benchmark syntax (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Syntax-check benchmark harness
        run: node --check benchmarks/node/bench.mjs

  windows-x64-msvc:
    name: Windows x64 MSVC
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: js-xqdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js-xqdb/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build release native addon
        run: npm run build:native:release -- --target x86_64-pc-windows-msvc
      - name: Build TypeScript
        run: npm run build:ts
      - name: Run Vitest
        run: npm test
      - name: Stage and pack packages
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item xqdb.win32-x64-msvc.node npm/win32-x64-msvc/xqdb.win32-x64-msvc.node
          npm pack --pack-destination artifacts
          npm pack ./npm/win32-x64-msvc --pack-destination artifacts
      - name: Smoke-test packed installation
        run: |
          $version = node -p "require('./package.json').version"
          $platformVersion = node -p "require('./npm/win32-x64-msvc/package.json').version"
          $rootTarball = (Resolve-Path "artifacts/xbbg-xqdb-$version.tgz").Path
          $platformTarball = (Resolve-Path "artifacts/xbbg-xqdb-win32-x64-msvc-$platformVersion.tgz").Path
          $smokeDir = Join-Path $env:RUNNER_TEMP "xqdb-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory $smokeDir | Out-Null
          Set-Location $smokeDir
          npm init -y
          npm install --omit=optional --no-audit --no-fund $rootTarball $platformTarball
          node --input-type=module -e 'const { serializeAsIpcBytes6 } = await import("@xbbg/xqdb"); const bytes = await serializeAsIpcBytes6("sync", false, 42); if (!Buffer.isBuffer(bytes) || bytes.length === 0) throw new Error("native serialization returned no bytes");'
      - name: Upload packed packages and native addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xqdb-win32-x64-msvc
          if-no-files-found: error
          retention-days: 7
          path: |
            js-xqdb/artifacts/*.tgz
            js-xqdb/xqdb.win32-x64-msvc.node

  linux-x64-gnu:
    name: Linux x64 GNU (glibc 2.28)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
    defaults:
      run:
        shell: bash
        working-directory: js-xqdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js-xqdb/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run Rust unit tests
        working-directory: .
        run: cargo test --locked -p xqdb -p napi-xqdb

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build release native addon
        run: npm run build:native:release -- --target x86_64-unknown-linux-gnu
      - name: Build TypeScript
        run: npm run build:ts
      - name: Run Vitest
        run: npm test
      - name: Stage and pack packages
        run: |
          mkdir -p artifacts
          cp xqdb.linux-x64-gnu.node npm/linux-x64-gnu/xqdb.linux-x64-gnu.node
          npm pack --pack-destination artifacts
          npm pack ./npm/linux-x64-gnu --pack-destination artifacts
      - name: Smoke-test packed installation on glibc 2.28
        run: |
          version="$(node -p "require('./package.json').version")"
          platform_version="$(node -p "require('./npm/linux-x64-gnu/package.json').version")"
          root_tarball="$PWD/artifacts/xbbg-xqdb-$version.tgz"
          platform_tarball="$PWD/artifacts/xbbg-xqdb-linux-x64-gnu-$platform_version.tgz"
          smoke_dir="$RUNNER_TEMP/xqdb-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$smoke_dir"
          cd "$smoke_dir"
          npm init -y
          npm install --omit=optional --no-audit --no-fund "$root_tarball" "$platform_tarball"
          node --input-type=module -e 'const { serializeAsIpcBytes6 } = await import("@xbbg/xqdb"); const bytes = await serializeAsIpcBytes6("sync", false, 42); if (!Buffer.isBuffer(bytes) || bytes.length === 0) throw new Error("native serialization returned no bytes");'
      - name: Upload packed packages and native addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xqdb-linux-x64-gnu
          if-no-files-found: error
          retention-days: 7
          path: |
            js-xqdb/artifacts/*.tgz
            js-xqdb/xqdb.linux-x64-gnu.node

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: js-xqdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js-xqdb/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build release native addon
        run: npm run build:native:release -- --target aarch64-apple-darwin
      - name: Build TypeScript
        run: npm run build:ts
      - name: Run Vitest
        run: npm test
      - name: Stage and pack packages
        run: |
          mkdir -p artifacts
          cp xqdb.darwin-arm64.node npm/darwin-arm64/xqdb.darwin-arm64.node
          npm pack --pack-destination artifacts
          npm pack ./npm/darwin-arm64 --pack-destination artifacts
      - name: Smoke-test packed installation
        run: |
          version="$(node -p "require('./package.json').version")"
          platform_version="$(node -p "require('./npm/darwin-arm64/package.json').version")"
          root_tarball="$PWD/artifacts/xbbg-xqdb-$version.tgz"
          platform_tarball="$PWD/artifacts/xbbg-xqdb-darwin-arm64-$platform_version.tgz"
          smoke_dir="$RUNNER_TEMP/xqdb-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$smoke_dir"
          cd "$smoke_dir"
          npm init -y
          npm install --omit=optional --no-audit --no-fund "$root_tarball" "$platform_tarball"
          node --input-type=module -e 'const { serializeAsIpcBytes6 } = await import("@xbbg/xqdb"); const bytes = await serializeAsIpcBytes6("sync", false, 42); if (!Buffer.isBuffer(bytes) || bytes.length === 0) throw new Error("native serialization returned no bytes");'
      - name: Upload packed packages and native addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xqdb-darwin-arm64
          if-no-files-found: error
          retention-days: 7
          path: |
            js-xqdb/artifacts/*.tgz
            js-xqdb/xqdb.darwin-arm64.node

  node-20-floor:
    name: Node 20 minimum runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: js-xqdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: js-xqdb/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: node20
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build on the minimum Node runtime
        run: |
          npm run build:native:release -- --target x86_64-unknown-linux-gnu
          npm run build:ts
      - name: Run Vitest on the minimum Node runtime
        run: npm test
      - name: Smoke-test packed installation on the minimum Node runtime
        run: |
          mkdir -p artifacts
          cp xqdb.linux-x64-gnu.node npm/linux-x64-gnu/xqdb.linux-x64-gnu.node
          npm pack --pack-destination artifacts
          npm pack ./npm/linux-x64-gnu --pack-destination artifacts
          version="$(node -p "require('./package.json').version")"
          platform_version="$(node -p "require('./npm/linux-x64-gnu/package.json').version")"
          smoke_dir="$RUNNER_TEMP/xqdb-node20-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$smoke_dir"
          cd "$smoke_dir"
          npm init -y
          npm install --omit=optional --no-audit --no-fund \
            "$GITHUB_WORKSPACE/js-xqdb/artifacts/xbbg-xqdb-$version.tgz" \
            "$GITHUB_WORKSPACE/js-xqdb/artifacts/xbbg-xqdb-linux-x64-gnu-$platform_version.tgz"
          node --input-type=module -e 'const { serializeAsIpcBytes6 } = await import("@xbbg/xqdb"); const bytes = await serializeAsIpcBytes6("sync", false, 42); if (!Buffer.isBuffer(bytes) || bytes.length === 0) throw new Error("native serialization returned no bytes");'
