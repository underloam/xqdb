name: npm release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to build (dry runs only)
        type: string
      dry-run:
        description: Build, pack, and smoke-test without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate versions and immutable tag
        id: release
        shell: bash
        env:
          LIVE_RELEASE: ${{ github.event_name == 'push' || inputs.dry-run == false }}
          REQUESTED_SHA: ${{ inputs.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          version="$(node <<'NODE'
          const { readFileSync } = require("node:fs");

          const readJson = (path) => JSON.parse(readFileSync(path, "utf8"));
          const root = readJson("js-xqdb/package.json");
          const lock = readJson("js-xqdb/package-lock.json");
          const nativePackages = [
            ["@xbbg/xqdb-win32-x64-msvc", readJson("js-xqdb/npm/win32-x64-msvc/package.json")],
            ["@xbbg/xqdb-linux-x64-gnu", readJson("js-xqdb/npm/linux-x64-gnu/package.json")],
            ["@xbbg/xqdb-darwin-arm64", readJson("js-xqdb/npm/darwin-arm64/package.json")],
          ];
          const cargo = readFileSync("Cargo.toml", "utf8");
          const workspaceStart = cargo.indexOf("[workspace.package]");
          if (workspaceStart < 0) throw new Error("Cargo.toml has no [workspace.package] section");
          const workspaceRest = cargo.slice(workspaceStart + "[workspace.package]".length);
          const workspaceEnd = workspaceRest.search(/\r?\n\[/);
          const workspaceSection = workspaceEnd < 0 ? workspaceRest : workspaceRest.slice(0, workspaceEnd);
          const workspaceVersion = workspaceSection.match(/^version\s*=\s*"([^"]+)"/m)?.[1];

          const expectedName = "@xbbg/xqdb";
          if (root.name !== expectedName) {
            throw new Error(`Expected root package ${expectedName}, got ${root.name}`);
          }
          const namedManifests = [
            ["package-lock.json", lock.name],
            ["package-lock.json root package", lock.packages?.[""]?.name],
          ];
          for (const [label, actual] of namedManifests) {
            if (actual !== expectedName) throw new Error(`${label} name ${actual} does not match ${expectedName}`);
          }

          const version = root.version;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Node package version ${version} is not a stable semantic version`);
          }
          const parts = version.split(".").map(Number);
          const floor = [0, 1, 2];
          const belowFloor = parts.some((part, index) =>
            part !== floor[index] && parts.slice(0, index).every((value, prior) => value === floor[prior])
              ? part < floor[index]
              : false,
          );
          if (belowFloor) throw new Error(`npm releases must be version 0.1.2 or newer, got ${version}`);

          const versionedManifests = [
            ["Cargo.toml workspace", workspaceVersion],
            ["package-lock.json", lock.version],
            ["package-lock.json root package", lock.packages?.[""]?.version],
            ...nativePackages.map(([name, manifest]) => [`${name} package`, manifest.version]),
          ];
          for (const [label, actual] of versionedManifests) {
            if (actual !== version) throw new Error(`${label} version ${actual} does not match ${version}`);
          }

          // The committed manifest and lock intentionally carry no optionalDependencies:
          // the pins would name an unpublished version and break `npm ci` on the release
          // tag. They are injected in the assemble job, which then asserts the packed
          // tarball contains all three at exactly this version. Validate the platform
          // manifests here so a skewed npm/ directory still fails before any build.
          for (const [name, manifest] of nativePackages) {
            if (manifest.name !== name) throw new Error(`Expected native package ${name}, got ${manifest.name}`);
          }
          for (const [label, container] of [["@xbbg/xqdb", root], ["package-lock root package", lock.packages?.[""]]]) {
            if (container?.optionalDependencies !== undefined) {
              throw new Error(`${label} must not declare optionalDependencies; they are injected at pack time`);
            }
          }

          process.stdout.write(version);
          NODE
          )"

          sha="$(git rev-parse HEAD)"
          expected_tag="v$version"

          if [[ "$SOURCE_REF" == refs/tags/* && "$SOURCE_REF" != "refs/tags/$expected_tag" ]]; then
            echo "Release ref $SOURCE_REF does not match package version $version." >&2
            exit 1
          fi

          if [[ "$LIVE_RELEASE" == "true" ]]; then
            if [[ -n "$REQUESTED_SHA" ]]; then
              echo "Live releases cannot use a SHA override." >&2
              exit 1
            fi
            if [[ "$SOURCE_REF" != "refs/tags/$expected_tag" ]]; then
              echo "Live releases must run from exact tag $expected_tag." >&2
              exit 1
            fi
            if ! actual_tag="$(git describe --tags --exact-match --match 'v[0-9]*')"; then
              echo "Source commit $sha is not exactly tagged." >&2
              exit 1
            fi
            if [[ "$actual_tag" != "$expected_tag" ]]; then
              echo "Source tag $actual_tag does not match package version $version." >&2
              exit 1
            fi
          fi

          {
            echo "commit=$sha"
            echo "publish=$LIVE_RELEASE"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  windows-x64-msvc:
    name: Build Windows x64 MSVC package
    needs: source
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: js-xqdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install JavaScript dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build and pack native package
        run: |
          npm run build:native:release -- --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item xqdb.win32-x64-msvc.node npm/win32-x64-msvc/xqdb.win32-x64-msvc.node
          npm pack ./npm/win32-x64-msvc --pack-destination artifacts
      - name: Upload native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-win32-x64-msvc
          if-no-files-found: error
          retention-days: 7
          path: js-xqdb/artifacts/*.tgz

  linux-x64-gnu:
    name: Build Linux x64 GNU package
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
    defaults:
      run:
        shell: bash
        working-directory: js-xqdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install JavaScript dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build and pack native package
        run: |
          npm run build:native:release -- --target x86_64-unknown-linux-gnu
          mkdir -p artifacts
          cp xqdb.linux-x64-gnu.node npm/linux-x64-gnu/xqdb.linux-x64-gnu.node
          npm pack ./npm/linux-x64-gnu --pack-destination artifacts
          cp native.js native.d.ts artifacts/
      - name: Upload native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-linux-x64-gnu
          if-no-files-found: error
          retention-days: 7
          path: |
            js-xqdb/artifacts/*.tgz
            js-xqdb/artifacts/native.js
            js-xqdb/artifacts/native.d.ts

  macos-arm64:
    name: Build macOS arm64 package
    needs: source
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: js-xqdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install JavaScript dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build and pack native package
        run: |
          npm run build:native:release -- --target aarch64-apple-darwin
          mkdir -p artifacts
          cp xqdb.darwin-arm64.node npm/darwin-arm64/xqdb.darwin-arm64.node
          npm pack ./npm/darwin-arm64 --pack-destination artifacts
      - name: Upload native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-darwin-arm64
          if-no-files-found: error
          retention-days: 7
          path: js-xqdb/artifacts/*.tgz

  assemble:
    name: Assemble and smoke-test npm packages
    needs: [source, windows-x64-msvc, linux-x64-gnu, macos-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: js-xqdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install JavaScript dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Download native packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: npm-*
          path: js-xqdb/artifacts
          merge-multiple: true
      - name: Build TypeScript and pack root package
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          cp artifacts/native.js native.js
          cp artifacts/native.d.ts native.d.ts
          npm run build:ts
          # The committed manifest carries no optionalDependencies, so the release tag
          # stays npm ci-installable while the natives are still unpublished. Inject the
          # exact pins here, then prove they survived into the tarball. `publish` needs
          # this job, so a failure below cannot publish a root package without pins.
          npm run set-optional-deps
          npm pack --pack-destination artifacts
          node scripts/assert-packed-pins.mjs "artifacts/xbbg-xqdb-$VERSION.tgz" "$VERSION"
      - name: Smoke-test packed Linux installation
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          root_tarball="$PWD/artifacts/xbbg-xqdb-$VERSION.tgz"
          linux_tarball="$PWD/artifacts/xbbg-xqdb-linux-x64-gnu-$VERSION.tgz"
          test -f "$PWD/artifacts/xbbg-xqdb-win32-x64-msvc-$VERSION.tgz"
          test -f "$PWD/artifacts/xbbg-xqdb-darwin-arm64-$VERSION.tgz"
          test -f "$root_tarball"
          test -f "$linux_tarball"

          smoke_dir="$RUNNER_TEMP/xqdb-npm-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$smoke_dir"
          cd "$smoke_dir"
          npm init -y
          npm install --omit=optional --no-audit --no-fund "$root_tarball" "$linux_tarball"
          node --input-type=module -e 'const { serializeAsIpcBytes6 } = await import("@xbbg/xqdb"); const bytes = await serializeAsIpcBytes6("sync", false, 42); if (!Buffer.isBuffer(bytes) || bytes.length === 0) throw new Error("native serialization returned no bytes");'
      - name: Upload assembled npm packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-packages
          if-no-files-found: error
          retention-days: 7
          path: js-xqdb/artifacts/*.tgz

  # Trusted publisher claim: underloam/xqdb, workflow NPM.yml, environment npm.
  # Renaming this file or environment requires re-registering every npm package.
  publish:
    name: Publish npm packages
    if: needs.source.outputs.publish == 'true' && github.repository == 'underloam/xqdb'
    needs: [source, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@xbbg/xqdb
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install trusted-publishing npm client
        run: npm install --global npm@11.17.0 --no-audit --no-fund --registry https://registry.npmjs.org
      - name: Download assembled npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-packages
          path: dist
      - name: Publish native packages, then @xbbg/xqdb
        shell: bash
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          bootstrap_npmrc=
          cleanup_bootstrap() {
            [[ -z "$bootstrap_npmrc" ]] || rm -f "$bootstrap_npmrc"
          }
          trap cleanup_bootstrap EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          if [[ -n "$NPM_BOOTSTRAP_TOKEN" ]]; then
            bootstrap_npmrc="$RUNNER_TEMP/xqdb-bootstrap.npmrc"
            (umask 077; printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_BOOTSTRAP_TOKEN" > "$bootstrap_npmrc")
          fi

          tarball_integrity() {
            node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write("sha512-" + createHash("sha512").update(readFileSync(process.argv[1])).digest("base64"))' "$1"
          }

          publish_if_missing() {
            local name="$1"
            local tarball="./$2"
            local published
            if published="$(npm view "$name@$VERSION" version --registry https://registry.npmjs.org 2>/dev/null)" && [[ "$published" == "$VERSION" ]]; then
              local local_integrity
              local remote_integrity
              local_integrity="$(tarball_integrity "$tarball")"
              remote_integrity="$(npm view "$name@$VERSION" dist.integrity --registry https://registry.npmjs.org)"
              if [[ "$remote_integrity" != "$local_integrity" ]]; then
                echo "$name@$VERSION is published with different content than $tarball." >&2
                exit 1
              fi
              echo "$name@$VERSION is already published and byte-identical; leaving it unchanged."
              return
            fi

            if npm view "$name" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              (unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG; npm publish "$tarball" --access public --provenance --registry https://registry.npmjs.org)
              return
            fi

            if [[ -z "$bootstrap_npmrc" ]]; then
              echo "First publish of $name requires the protected bootstrap credential." >&2
              exit 1
            fi
            (export NPM_CONFIG_USERCONFIG="$bootstrap_npmrc"; npm publish "$tarball" --access public --provenance --registry https://registry.npmjs.org)
          }

          publish_if_missing @xbbg/xqdb-win32-x64-msvc "dist/xbbg-xqdb-win32-x64-msvc-$VERSION.tgz"
          publish_if_missing @xbbg/xqdb-linux-x64-gnu "dist/xbbg-xqdb-linux-x64-gnu-$VERSION.tgz"
          publish_if_missing @xbbg/xqdb-darwin-arm64 "dist/xbbg-xqdb-darwin-arm64-$VERSION.tgz"
          publish_if_missing @xbbg/xqdb "dist/xbbg-xqdb-$VERSION.tgz"
      - name: Verify published package and provenance
        shell: bash
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          verify_dir="$RUNNER_TEMP/xqdb-npm-verify-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$verify_dir"
          cd "$verify_dir"
          npm init -y >/dev/null
          install_published() {
            npm install --force --ignore-scripts --no-audit --no-fund \
              "@xbbg/xqdb@$VERSION" \
              "@xbbg/xqdb-win32-x64-msvc@$VERSION" \
              "@xbbg/xqdb-linux-x64-gnu@$VERSION" \
              "@xbbg/xqdb-darwin-arm64@$VERSION"
          }
          # The registry can take several minutes to serve a fresh version: the 0.1.5 and
          # 0.1.7 publishes both succeeded yet failed this check inside a 100-second window,
          # each needing a manual rerun to reach the GitHub Release job.
          for attempt in $(seq 1 10); do
            if install_published; then
              break
            fi
            if [[ "$attempt" -eq 10 ]]; then
              echo "Published packages did not become readable." >&2
              exit 1
            fi
            sleep 30
          done

          audit_report="$verify_dir/signatures.json"
          trap 'rm -f "$audit_report"' EXIT
          verify_provenance() {
            npm audit signatures --json --include-attestations > "$audit_report" || true
            AUDIT_REPORT="$audit_report" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const report = JSON.parse(readFileSync(process.env.AUDIT_REPORT, "utf8"));
          const subject = ({ name, version }) => `${name}@${version}`;
          const expected = [
            "@xbbg/xqdb",
            "@xbbg/xqdb-win32-x64-msvc",
            "@xbbg/xqdb-linux-x64-gnu",
            "@xbbg/xqdb-darwin-arm64",
          ].map((name) => `${name}@${process.env.VERSION}`);
          const bad = new Set([...(report.invalid ?? []), ...(report.missing ?? [])].map(subject));
          const failed = expected.filter((entry) => bad.has(entry));
          if (failed.length !== 0) {
            throw new Error(`Signature or attestation verification failed: ${failed.join(", ")}`);
          }
          const verified = new Map((report.verified ?? []).map((entry) => [subject(entry), entry]));
          const missing = expected.filter((entry) => !verified.has(entry));
          if (missing.length !== 0) {
            throw new Error(`Missing verified provenance attestations: ${missing.join(", ")}`);
          }
          const invalidProvenance = expected.filter((entry) => {
            const predicateType = verified.get(entry)?.attestations?.provenance?.predicateType;
            return typeof predicateType !== "string" || !predicateType.startsWith("https://slsa.dev/provenance/");
          });
          if (invalidProvenance.length !== 0) {
            throw new Error(`Missing SLSA build provenance: ${invalidProvenance.join(", ")}`);
          }
          NODE
          }
          for attempt in $(seq 1 10); do
            if verify_provenance; then
              break
            fi
            if [[ "$attempt" -eq 10 ]]; then
              echo "Published provenance did not become verifiable." >&2
              exit 1
            fi
            sleep 30
          done
          node --input-type=module -e 'const { serializeAsIpcBytes6 } = await import("@xbbg/xqdb"); const bytes = await serializeAsIpcBytes6("sync", false, 42); if (!Buffer.isBuffer(bytes) || bytes.length === 0) throw new Error("published package returned no bytes");'
  github-release:
    name: Attach npm packages to GitHub Release
    if: needs.source.outputs.publish == 'true' && github.repository == 'underloam/xqdb'
    needs: [source, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Download assembled npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-packages
          path: dist
      - name: Attach packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.source.outputs.version }}
        run: |
          release_asset_digest() {
            local asset_name="$1"
            local assets
            local name
            local digest
            assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '.assets[] | [.name, .digest] | @tsv' 2>/dev/null)" || return 1
            while IFS=$'\t' read -r name digest; do
              if [[ "$name" == "$asset_name" ]]; then
                printf '%s' "$digest"
                return
              fi
            done <<< "$assets"
          }

          notes_file="docs/release-notes/$TAG.md"
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          else
            notes_args=(--generate-notes)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A pre-created release keeps whatever body it has unless this release
            # ships checked-in notes, which must win: --generate-notes produces only
            # commit subjects and would silently drop any migration guidance.
            if [[ -f "$notes_file" ]]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
                --notes-file "$notes_file" >/dev/null
            fi
          elif ! gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag "${notes_args[@]}" >/dev/null 2>&1; then
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "GitHub Release $TAG could not be created or verified." >&2
              exit 1
            fi
          fi

          for asset in dist/*.tgz; do
            if [[ ! -f "$asset" ]]; then
              echo "No npm packages were downloaded." >&2
              exit 1
            fi
            asset_name="${asset##*/}"
            local_digest="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
            remote_digest="$(release_asset_digest "$asset_name" || true)"
            if [[ -n "$remote_digest" ]]; then
              if [[ "$remote_digest" != "$local_digest" ]]; then
                echo "Release asset $asset_name already exists with a different digest." >&2
                exit 1
              fi
              continue
            fi
            gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            verified=false
            for _ in 1 2 3 4 5 6; do
              remote_digest="$(release_asset_digest "$asset_name" || true)"
              if [[ "$remote_digest" == "$local_digest" ]]; then
                verified=true
                break
              fi
              if [[ -n "$remote_digest" ]]; then
                break
              fi
              sleep 2
            done
            if [[ "$verified" != "true" ]]; then
              echo "Release asset $asset_name could not be uploaded or verified." >&2
              exit 1
            fi
          done
