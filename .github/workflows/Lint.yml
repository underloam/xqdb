name: Lint and format

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install locked lint tooling without building the extension
        run: uv sync --locked --only-group lint
      - name: Check every Python source and benchmark
        run: uv run --no-sync ruff check .
      - name: Check Python formatting
        run: uv run --no-sync ruff format --check .

  oxc:
    name: Oxlint, Oxfmt and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            js-xqdb/package-lock.json
            benchmarks/node/package-lock.json
      - name: Install locked JavaScript tooling
        run: npm ci --prefix js-xqdb --no-audit --no-fund
      - name: Install locked benchmark client types
        run: npm ci --prefix benchmarks/node --ignore-scripts --no-audit --no-fund
      - name: Check source, tests, scripts, benchmarks and repository formatting
        run: npm --prefix js-xqdb run check
