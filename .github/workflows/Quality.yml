name: Rust and Python CI

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/*.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "bindings/**"
      - "py-xqdb/**"
      - "benchmarks/python/**"
      - "Taskfile.yml"
      - "testing/kdb/**"
  pull_request:
    paths:
      - ".github/workflows/*.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bindings/**"
      - "py-xqdb/**"
      - "benchmarks/python/**"
      - "Taskfile.yml"
      - "testing/kdb/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  python-benchmark-syntax:
    name: Python benchmark syntax (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - name: Compile-check benchmark harness
        run: python -m py_compile benchmarks/python/bench.py

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --exclude py-xqdb --all-targets --locked
      - name: Run Rust doctests
        run: cargo test --workspace --exclude py-xqdb --doc --locked

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-15
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: py${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            Cargo.lock
      - name: Install Python dependencies
        env:
          SETUPTOOLS_RUST_CARGO_PROFILE: release
        run: uv pip install --system --group dev -e .
      - name: Run Python tests
        run: python -m pytest -q py-xqdb/test

  python-lowest-direct:
    name: Python ${{ matrix.python-version }} lowest direct runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            pyarrow-version: "20.0.0"
          # PyArrow 20 and 21 have no CPython 3.14 wheel. Lowest-direct with
          # binary runtime artifacts therefore selects the first compatible
          # supported wheel rather than attempting an unsupported source build.
          - python-version: "3.14"
            pyarrow-version: "22.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: lowest-py${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            Cargo.lock
      - name: Build wheel at the interpreter endpoint
        env:
          SETUPTOOLS_RUST_CARGO_PROFILE: release
        run: uv build --wheel --out-dir dist
      - name: Install lowest direct runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv venv floor --python "${{ matrix.python-version }}"
          uv pip install --python floor/bin/python \
            --resolution lowest-direct \
            --only-binary :all: \
            dist/*.whl
      - name: Install current test tooling without lowering its dependency set
        shell: bash
        run: uv pip install --python floor/bin/python --group dev
      - name: Verify selected direct dependency floors
        shell: bash
        env:
          EXPECTED_PYARROW: ${{ matrix.pyarrow-version }}
        run: |
          floor/bin/python - <<'PY'
          from importlib.metadata import version
          import os

          expected = {
              "narwhals": "2.10.0",
              "pyarrow": os.environ["EXPECTED_PYARROW"],
          }
          actual = {name: version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"lowest-direct runtime mismatch: expected {expected}, got {actual}")
          PY
      - name: Run Python tests from the built wheel
        run: floor/bin/python -m pytest -q py-xqdb/test
