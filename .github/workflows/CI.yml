name: XQDB CI

on:
  workflow_dispatch:
    inputs:
      # Commit to build. If omitted, use the workflow-dispatch ref.
      sha:
        description: Commit SHA
        type: string
      # Create the sdist and build the wheels, but do not publish to PyPI / GitHub.
      dry-run:
        description: Dry run
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.commit.outputs.version }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - name: Validate live release source
        if: inputs.dry-run == false
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -n "$REQUESTED_SHA" || "$DISPATCH_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Live releases must be dispatched from the default branch without a SHA override." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.dry-run && inputs.sha || github.sha }}
          fetch-depth: 0
      - name: Resolve immutable source commit
        id: commit
        env:
          LIVE_RELEASE: ${{ inputs.dry-run == false }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$LIVE_RELEASE" == "true" ]]; then
            version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
            expected_tag="v$version"
            if ! actual_tag="$(git describe --tags --exact-match --match 'v[0-9]*')"; then
              echo "Live releases require an exact v-prefixed version tag on the source commit." >&2
              exit 1
            fi
            if [[ "$actual_tag" != "$expected_tag" ]]; then
              echo "Release tag $actual_tag does not match workspace version $version." >&2
              exit 1
            fi
            {
              echo "version=$version"
              echo "tag=$expected_tag"
            } >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: source
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
    timeout-minutes: 60
    env:
      UV_PYTHON: /opt/python/cp312-cp312/bin/python
      SETUPTOOLS_RUST_CARGO_PROFILE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
      - name: Build wheel
        run: uv build --wheel --out-dir build-wheel
      - name: Repair manylinux wheel
        run: auditwheel repair build-wheel/*.whl --plat manylinux_2_28_x86_64 --wheel-dir dist
      - name: Smoke-test wheel
        run: |
          uv venv smoke --python "$UV_PYTHON"
          python="$PWD/smoke/bin/python"
          uv pip install --python "$python" dist/*.whl
          "$python" -c 'import xqdb; data = xqdb.serialize_as_ipc_bytes6("sync", False, 42); assert data'
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-linux-x86_64
          path: dist

  windows:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SETUPTOOLS_RUST_CARGO_PROFILE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
      - name: Build wheel
        run: uv build --wheel --out-dir dist
      - name: Smoke-test wheel
        run: |
          uv venv smoke --python 3.12
          python="$PWD/smoke/Scripts/python.exe"
          uv pip install --python "$python" dist/*.whl
          "$python" -c 'import xqdb; data = xqdb.serialize_as_ipc_bytes6("sync", False, 42); assert data'
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-windows-x86_64
          path: dist

  macos:
    needs: source
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      SETUPTOOLS_RUST_CARGO_PROFILE: release
      _PYTHON_HOST_PLATFORM: macosx-11.0-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
      - name: Build wheel
        run: uv build --wheel --out-dir dist
      - name: Verify wheel platform tag
        run: |
          wheel=(dist/*.whl)
          [[ ${#wheel[@]} -eq 1 && ${wheel[0]} == *-macosx_11_0_arm64.whl ]]
      - name: Smoke-test wheel
        run: |
          uv venv smoke --python 3.12
          python="$PWD/smoke/bin/python"
          uv pip install --python "$python" dist/*.whl
          "$python" -c 'import xqdb; data = xqdb.serialize_as_ipc_bytes6("sync", False, 42); assert data'
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-macos-arm64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    needs: source
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
      - name: Build sdist
        run: uv build --sdist --out-dir dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    if: inputs.dry-run == false && inputs.sha == '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.repository == 'underloam/xqdb'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [source, linux, windows, macos, sdist]
    environment:
      name: pypi
      url: https://pypi.org/project/xqdb
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish with provenance attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  # If attachment fails after PyPI succeeds, rerun failed jobs only; the publish job remains successful.
  github-release:
    name: Attach Python distributions to GitHub Release
    if: inputs.dry-run == false && inputs.sha == '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.repository == 'underloam/xqdb'
    needs: [source, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          release_asset_digest() {
            local asset_name="$1"
            local assets
            local name
            local digest
            assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '.assets[] | [.name, .digest] | @tsv' 2>/dev/null)" || return 1
            while IFS=$'\t' read -r name digest; do
              if [[ "$name" == "$asset_name" ]]; then
                printf '%s' "$digest"
                return
              fi
            done <<< "$assets"
          }

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes >/dev/null 2>&1; then
              if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "GitHub Release $TAG could not be created or verified." >&2
                exit 1
              fi
            fi
          fi

          for asset in dist/*; do
            if [[ ! -f "$asset" ]]; then
              echo "No Python distributions were downloaded." >&2
              exit 1
            fi
            asset_name="${asset##*/}"
            local_digest="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
            remote_digest="$(release_asset_digest "$asset_name" || true)"
            if [[ -n "$remote_digest" ]]; then
              if [[ "$remote_digest" != "$local_digest" ]]; then
                echo "Release asset $asset_name already exists with a different digest." >&2
                exit 1
              fi
              continue
            fi
            gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            verified=false
            for _ in 1 2 3 4 5 6; do
              remote_digest="$(release_asset_digest "$asset_name" || true)"
              if [[ "$remote_digest" == "$local_digest" ]]; then
                verified=true
                break
              fi
              if [[ -n "$remote_digest" ]]; then
                break
              fi
              sleep 2
            done
            if [[ "$verified" != "true" ]]; then
              echo "Release asset $asset_name could not be uploaded or verified." >&2
              exit 1
            fi
          done
