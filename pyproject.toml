[build-system]
requires = [
  "setuptools==84.0.0",
  "wheel==0.48.0",
  "setuptools-scm==10.2.1",
  "setuptools-rust==1.13.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "xqdb"
description = "High-performance, backend-agnostic q IPC for Python and Node.js"
readme = { file = "py-xqdb/README.md", content-type = "text/markdown" }
authors = [{ name = "XQDB contributors" }]
license = "BSD-3-Clause"
license-files = ["py-xqdb/LICENSE"]
requires-python = ">=3.10,<3.15"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
]
keywords = ["q", "kdb", "narwhals", "dataframe", "arrow"]
dynamic = ["version"]
dependencies = ["narwhals>=2.10.0", "pyarrow>=20.0.0"]

[dependency-groups]
lint = ["ruff==0.16.4"]
dev = [
  "build>=1.3",
  "pytest>=8.4",
  { include-group = "lint" },
  "pandas>=2.2",
  "polars>=1.31.0",
  # Windows ships no system tz database, so the DST normalization tests need this
  # explicitly rather than relying on pandas to pull it in transitively.
  "tzdata; sys_platform == 'win32'",
  "patchelf; sys_platform == 'linux'",
]
# Exact pins keep benchmark runs comparable across machines and subjects.
# kola and qconnect are the benchmark competitors; requests is a qconnect
# dependency it fails to declare. PyKX is deliberately absent: its licence
# forbids publishing performance comparisons.
# pandas is gated by version rather than narrowing the package's own
# requires-python: pandas 3 needs Python 3.11+, and the benchmark needs pandas on
# every supported interpreter because the subject table always includes a pandas
# backend and the report reads pandas' version unconditionally.
benchmark = [
  "polars==1.44.1",
  "pandas==3.0.5; python_version >= '3.11'",
  "pandas==2.3.3; python_version < '3.11'",
  "kola==2.5.1",
  "qconnect==0.1.6",
  "requests==2.34.2",
  "psutil==7.2.2",
]

[project.urls]
Repository = "https://github.com/underloam/xqdb"

[tool.setuptools_scm]
tag_regex = '^v(?P<version>\d+\.\d+\.\d+(?:(?:a|b|rc|alpha|beta)\d+)?)$'

[tool.setuptools_scm.scm.git]
describe_command = 'git describe --dirty --tags --long --match "v[0-9]*"'

[[tool.setuptools-rust.ext-modules]]
target = "xqdb.xqdb"
path = "py-xqdb/Cargo.toml"
binding = "PyO3"

[tool.setuptools.packages.find]
where = ["py-xqdb"]
include = ["xqdb*"]

[tool.ruff]
required-version = "==0.16.4"
target-version = "py310"
line-length = 100
extend-exclude = [".pixi", "target"]

[tool.ruff.lint]
select = ["ALL"]
# Keep annotations compatible with Python 3.10 without adding a runtime backport dependency.
typing-extensions = false
ignore = [
  # The formatter owns trailing commas; use one consistent docstring convention.
  "COM812",
  "D203",
  "D213",
  # Licensing is maintained in LICENSE rather than duplicated in every source file.
  "CPY001",
]

[tool.ruff.lint.per-file-ignores]
# Tests express expected values directly and pytest rewrites their assertions.
"py-xqdb/test/**" = ["D", "PLR2004", "S101"]
# The benchmark is a standalone CLI, not a package; its scheduler is not cryptography.
"benchmarks/python/bench.py" = ["INP001", "T201", "S311"]
# These public APIs return arbitrary q values and retain their published argument surface.
"py-xqdb/xqdb/q.py" = ["ANN401", "FBT001", "FBT002", "PLR0913", "PLR0917"]
# `any` and positional enable_compression are public keyword/positional API contracts.
"py-xqdb/xqdb/util.py" = ["A002", "ANN401", "FBT001"]

[tool.ruff.lint.isort]
known-first-party = ["xqdb"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
